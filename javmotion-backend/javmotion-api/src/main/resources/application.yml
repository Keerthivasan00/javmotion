spring:
  application:
    name: javmotion-api
  profiles:
    default: dev
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      enabled: false

server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 128KB
    max-http-form-post-size: 128KB

javmotion:
  version: @project.version@
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
