spring:
  application:
    name: javmotion-api
  profiles:
    default: dev
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (db/migration)
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 128KB
    max-http-form-post-size: 128KB

javmotion:
  version: @project.version@
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
